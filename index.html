<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>综合查询系统</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
body { background: #0B1120; color: #F1F5F9; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; }
.app { max-width: 480px; margin: 0 auto; }
.tab-bar { display: flex; background: #131B2E; border-radius: 12px; padding: 4px; margin-bottom: 24px; }
.tab-item { flex: 1; text-align: center; padding: 12px; cursor: pointer; border-radius: 8px; color: #94A3B8; }
.tab-item.active { background: #D4A853; color: #0B1120; font-weight: bold; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.form-card { background: #131B2E; padding: 24px; border-radius: 16px; margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; color: #94A3B8; font-size: 14px; }
input { width: 100%; height: 48px; background: #1A2440; border: 1px solid #334155; border-radius: 8px; padding: 0 12px; color: #F1F5F9; box-sizing: border-box; margin-bottom: 16px; }
button { width: 100%; height: 48px; background: #D4A853; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #0B1120; }
.hotel-card { background: #131B2E; border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
.hotel-header { padding: 20px; }
.hotel-name { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
.hotel-address { color: #94A3B8; font-size: 14px; }
.hotel-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
.photo-item { position: relative; aspect-ratio: 4/3; background: #1A2440; }
.photo-item img { width: 100%; height: 100%; object-fit: cover; }
.photo-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px; background: rgba(0,0,0,.7); font-size: 12px; }
.section-title { padding: 16px 20px 8px; font-weight: 600; }
.transport-list { padding: 0 20px 16px; }
.transport-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1E293B; }
.export-btn { background: linear-gradient(135deg, #D4A853, #B8923E); color: #0B1120; font-weight: bold; margin-bottom: 12px; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
.modal-overlay.show { display: flex; }
.modal-content { background: #131B2E; border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; padding: 24px; }
.suggest-dropdown { position: absolute; background: #1A2440; border-radius: 8px; margin-top: 4px; max-height: 280px; overflow-y: auto; z-index: 50; display: none; }
.suggest-dropdown.show { display: block; }
.suggest-item { padding: 12px 16px; cursor: pointer; }
.suggest-item:hover { background: rgba(212,168,83,.1); }
.hotel-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.hotel-meta span { background: #1A2440; padding: 4px 10px; border-radius: 6px; font-size: 12px; color: #D4A853; }
.hotel-rating { color: #FBBF24 !important; }
.hotel-phone { color: #94A3B8; font-size: 14px; margin-top: 6px; }
.photo-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1A2440; }
.placeholder-icon { font-size: 36px; margin-bottom: 8px; }
.transport-empty { padding: 0 20px 16px; color: #64748B; font-size: 14px; }
.hotel-result-item { background: #131B2E; padding: 16px 20px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
.hotel-result-item:hover { border-color: #D4A853; background: #1A2440; }
.hotel-result-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.hotel-result-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.hotel-result-meta span { background: #1A2440; padding: 3px 8px; border-radius: 4px; font-size: 11px; color: #D4A853; }
.search-result-count { color: #94A3B8; font-size: 13px; margin-bottom: 12px; }
.back-btn { background: #1A2440; color: #D4A853; border: 1px solid #D4A853; margin-bottom: 12px; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="tab-bar">
    <div class="tab-item active" data-tab="seat-tab">座位查询</div>
    <div class="tab-item" data-tab="hotel-tab">酒店查询</div>
  </div>

  <div class="tab-pane active" id="seat-tab">
    <div class="form-card">
      <label>参会人姓名</label>
      <input type="text" id="name-input" placeholder="请输入您的姓名">
      <button id="search-btn">查 询 座 位</button>
    </div>
  </div>

  <div class="tab-pane" id="hotel-tab">
    <div class="form-card">
      <label>酒店名称</label>
      <div style="position:relative">
        <input type="text" id="hotel-input" placeholder="支持名称/区域/城市搜索">
        <div class="suggest-dropdown" id="hotel-suggest"></div>
      </div>
      <button id="hotel-search-btn">查 询 酒 店</button>
    </div>
    <div id="hotel-results"></div>
    <div id="hotel-detail"></div>
    <button class="export-btn" id="export-btn" style="display:none">导出酒店推荐Word文档</button>
  </div>
</div>

<div class="modal-overlay" id="export-modal">
  <div class="modal-content">
    <h3 style="margin-top:0">导出酒店推荐文档</h3>
    <label>会议名称</label>
    <input type="text" id="doc-meeting-name" placeholder="例如：ICEPG 2024">
    <label>会议时间</label>
    <input type="text" id="doc-meeting-date" placeholder="例如：2024年9月27-29日">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label>大床房价格</label>
        <input type="number" id="doc-price-queen" placeholder="550">
      </div>
      <div>
        <label>双床房价格</label>
        <input type="number" id="doc-price-twin" placeholder="550">
      </div>
    </div>
    <label>预订联系人</label>
    <input type="text" id="doc-contact-name" placeholder="张经理">
    <label>预订电话</label>
    <input type="tel" id="doc-contact-phone" placeholder="13700000000">
    <label>预订截止日期</label>
    <input type="text" id="doc-deadline" placeholder="9月23日前">
    <div style="display:flex;gap:12px;margin-top:16px">
      <button id="export-cancel" style="background:#1A2440;color:#94A3B8">取消</button>
      <button id="export-confirm">生成文档</button>
    </div>
  </div>
</div>

<script src="seats.js"></script>
<script src="hotels.js?v=20260924"></script>
<script src="hotels_photos.js?v=20260924c"></script>
<script>
var currentHotel = null;
var lastSearchResults = null;
var lastSearchKeyword = '';

// Tab 切换
var tabs = document.querySelectorAll(".tab-item");
for (var i = 0; i < tabs.length; i++) {
  tabs[i].addEventListener("click", function() {
    var target = this.getAttribute("data-tab");
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].classList.remove("active");
    }
    this.classList.add("active");
    var panes = document.querySelectorAll(".tab-pane");
    for (var k = 0; k < panes.length; k++) {
      panes[k].classList.remove("active");
    }
    document.getElementById(target).classList.add("active");
  });
}

// 酒店查询
document.getElementById("hotel-search-btn").addEventListener("click", function() {
  var keyword = document.getElementById("hotel-input").value.trim();
  if (!keyword) return;
  searchHotelAndShow(keyword);
});

document.getElementById("hotel-input").addEventListener("input", function() {
  updateSuggest(this.value);
});

var CITY_NAMES = ['广州','北京','上海','深圳','杭州','成都','重庆','武汉','西安','南京','天津','苏州','长沙','青岛','大连','厦门','宁波','无锡','合肥','福州','济南','郑州','沈阳','哈尔滨','长春','石家庄','太原','南昌','贵阳','昆明','兰州','西宁','银川','乌鲁木齐','呼和浩特','拉萨','南宁','海口','三亚','东莞','佛山','珠海','中山','惠州','江门','肇庆','清远','汕头','湛江','梅州','韶关','河源','阳江','茂名','潮州','揭阳','云浮'];

function parseKeywords(input) {
  var keywords = [];
  var parts = input.trim().split(/\s+/);
  for (var i = 0; i < parts.length; i++) {
    if (parts[i]) keywords.push(parts[i].toLowerCase());
  }
  if (keywords.length === 1 && input.indexOf(' ') === -1) {
    for (var j = 0; j < CITY_NAMES.length; j++) {
      var city = CITY_NAMES[j];
      if (input.indexOf(city) === 0 && input.length > city.length) {
        keywords = [city.toLowerCase(), input.substring(city.length).toLowerCase()];
        break;
      }
    }
  }
  return keywords;
}

function searchHotelAndShow(keyword) {
  var keywords = parseKeywords(keyword);
  var matches = [];
  if (typeof HOTEL_DATA !== "undefined") {
    for (var i = 0; i < HOTEL_DATA.length; i++) {
      var h = HOTEL_DATA[i];
      var searchText = (h.name + ' ' + (h.district || '') + ' ' + (h.city || '')).toLowerCase();
      var allMatch = true;
      for (var k = 0; k < keywords.length; k++) {
        if (searchText.indexOf(keywords[k]) === -1) {
          allMatch = false;
          break;
        }
      }
      if (allMatch) {
        matches.push(h);
      }
    }
  }
  if (matches.length > 0) {
    showHotelList(matches, keyword);
  } else {
    alert("未找到匹配的酒店: " + keyword);
  }
}

function showHotelList(hotels, keyword) {
  lastSearchResults = hotels;
  lastSearchKeyword = keyword;
  document.getElementById("hotel-detail").innerHTML = "";
  document.getElementById("export-btn").style.display = "none";
  
  var html = '<div class="search-result-count">找到 ' + hotels.length + ' 家匹配" ' + keyword + ' "的酒店，点击查看详情：</div>';
  for (var i = 0; i < hotels.length; i++) {
    var h = hotels[i];
    html += '<div class="hotel-result-item" data-index="' + i + '">';
    html += '<div class="hotel-result-name">' + h.name + '</div>';
    html += '<div class="hotel-result-meta">';
    if (h.star) html += '<span>' + h.star + '</span>';
    if (h.rating) html += '<span>⭐ ' + h.rating + '分</span>';
    if (h.district) html += '<span>' + h.district + '</span>';
    html += '</div></div>';
  }
  document.getElementById("hotel-results").innerHTML = html;
  
  var items = document.querySelectorAll(".hotel-result-item");
  for (var j = 0; j < items.length; j++) {
    items[j].addEventListener("click", function() {
      var idx = parseInt(this.getAttribute("data-index"));
      selectHotel(hotels[idx]);
    });
  }
}

function backToSearch() {
  if (lastSearchResults) {
    document.getElementById("hotel-detail").innerHTML = "";
    document.getElementById("export-btn").style.display = "none";
    showHotelList(lastSearchResults, lastSearchKeyword);
  }
}
function selectHotel(hotel) {
  currentHotel = hotel;
  document.getElementById("hotel-results").innerHTML = "";
  showHotelDetail(hotel);
  document.getElementById("export-btn").style.display = "block";
}

function showHotelDetail(hotel) {
  // 从照片映射文件获取照片（优先）
  var photoQueen = hotel.photoQueen;
  var photoTwin = hotel.photoTwin;
  if (typeof HOTEL_PHOTOS !== "undefined" && HOTEL_PHOTOS[hotel.name]) {
    if (HOTEL_PHOTOS[hotel.name].q) photoQueen = HOTEL_PHOTOS[hotel.name].q;
    if (HOTEL_PHOTOS[hotel.name].t) photoTwin = HOTEL_PHOTOS[hotel.name].t;
  }
  var html = '<button class="back-btn" onclick="backToSearch()">← 返回搜索结果</button>';
  html += '<div class="hotel-card">';
  html += '<div class="hotel-header">';
  html += '<div class="hotel-name">' + hotel.name + '</div>';
  html += '<div class="hotel-meta">';
  if (hotel.star) html += '<span class="hotel-star">' + hotel.star + '</span>';
  if (hotel.rating) html += '<span class="hotel-rating">⭐ ' + hotel.rating + '分</span>';
  if (hotel.reviews) html += '<span class="hotel-reviews">' + hotel.reviews + '</span>';
  if (hotel.district) html += '<span class="hotel-district">' + hotel.district + '</span>';
  html += '</div>';
  if (hotel.address) {
    html += '<div class="hotel-address">📍 ' + hotel.address + '</div>';
  }
  if (hotel.phone) {
    html += '<div class="hotel-phone">📞 ' + hotel.phone + '</div>';
  }
  html += '</div>';
  html += '<div class="hotel-photos">';
  if (photoQueen) {
    html += '<div class="photo-item"><img src="' + photoQueen + '"><div class="photo-label">大床房</div></div>';
  } else {
    html += '<div class="photo-item photo-placeholder"><div class="placeholder-icon">🛏️</div><div class="photo-label">大床房（照片待补充）</div></div>';
  }
  if (photoTwin) {
    html += '<div class="photo-item"><img src="' + photoTwin + '"><div class="photo-label">双床房</div></div>';
  } else {
    html += '<div class="photo-item photo-placeholder"><div class="placeholder-icon">🛏️🛏️</div><div class="photo-label">双床房（照片待补充）</div></div>';
  }
  html += '</div>';
  if (hotel.transport && hotel.transport.length > 0) {
    html += '<div class="section-title">周边交通枢纽</div><div class="transport-list">';
    for (var i = 0; i < hotel.transport.length; i++) {
      var t = hotel.transport[i];
      html += '<div class="transport-item"><span>' + t.name + '</span><span>' + t.distance + ' / ' + (t.drive || '') + '</span></div>';
    }
    html += '</div>';
  } else {
    html += '<div class="section-title">周边交通枢纽</div><div class="transport-empty">交通信息待补充</div>';
  }
  html += '</div>';
  document.getElementById("hotel-detail").innerHTML = html;
}

function updateSuggest(keyword) {
  var dropdown = document.getElementById("hotel-suggest");
  var input = keyword.trim();
  if (!input || typeof HOTEL_DATA === "undefined") {
    dropdown.classList.remove("show");
    return;
  }
  var keywords = parseKeywords(input);
  var matches = [];
  for (var i = 0; i < HOTEL_DATA.length; i++) {
    var h = HOTEL_DATA[i];
    var searchText = (h.name + ' ' + (h.district || '') + ' ' + (h.city || '')).toLowerCase();
    var allMatch = true;
    for (var k = 0; k < keywords.length; k++) {
      if (searchText.indexOf(keywords[k]) === -1) {
        allMatch = false;
        break;
      }
    }
    if (allMatch) {
      matches.push(h);
      if (matches.length >= 8) break;
    }
  }
  if (matches.length === 0) {
    dropdown.classList.remove("show");
    return;
  }
  var html = "";
  for (var j = 0; j < matches.length; j++) {
    var h = matches[j];
    html += '<div class="suggest-item" data-name="' + h.name + '">' + h.name + '</div>';
  }
  dropdown.innerHTML = html;
  dropdown.classList.add("show");
  var items = dropdown.querySelectorAll(".suggest-item");
  for (var k = 0; k < items.length; k++) {
    items[k].addEventListener("click", function() {
      document.getElementById("hotel-input").value = this.getAttribute("data-name");
      dropdown.classList.remove("show");
      searchHotelAndShow(this.getAttribute("data-name"));
    });
  }
}

// 导出功能
document.getElementById("export-btn").addEventListener("click", function() {
  document.getElementById("export-modal").classList.add("show");
});

document.getElementById("export-cancel").addEventListener("click", function() {
  document.getElementById("export-modal").classList.remove("show");
});

document.getElementById("export-confirm").addEventListener("click", async function() {
  if (!currentHotel) {
    alert("请先查询酒店");
    return;
  }
  if (typeof docx === "undefined") {
    alert("Word库未加载");
    return;
  }
  
  // 用户手动输入
  var meetingName = document.getElementById("doc-meeting-name").value.trim() || "ICEPG 2024";
  var meetingDate = document.getElementById("doc-meeting-date").value.trim() || "2024年9月27-29日";
  var priceQueen = document.getElementById("doc-price-queen").value.trim() || "550";
  var priceTwin = document.getElementById("doc-price-twin").value.trim() || "550";
  var contactName = document.getElementById("doc-contact-name").value.trim() || "张经理";
  var contactPhone = document.getElementById("doc-contact-phone").value.trim() || "13725427055";
  var deadline = document.getElementById("doc-deadline").value.trim() || "9月23日前";
  
  // 从酒店查询调取
  var hotel = currentHotel;
  // 从照片映射文件获取照片（优先）
  var exportPhotoQueen = hotel.photoQueen;
  var exportPhotoTwin = hotel.photoTwin;
  if (typeof HOTEL_PHOTOS !== "undefined" && HOTEL_PHOTOS[hotel.name]) {
    if (HOTEL_PHOTOS[hotel.name].q) exportPhotoQueen = HOTEL_PHOTOS[hotel.name].q;
    if (HOTEL_PHOTOS[hotel.name].t) exportPhotoTwin = HOTEL_PHOTOS[hotel.name].t;
  }
  var children = [];
  
  // 加载图片
  async function loadImage(url) {
    try {
      var response = await fetch(url);
      var blob = await response.blob();
      return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onloadend = function() {
          resolve(reader.result.split(',')[1]);
        };
        reader.readAsDataURL(blob);
      });
    } catch(e) {
      return null;
    }
  }
  
  var imgQueen = exportPhotoQueen ? await loadImage(exportPhotoQueen) : null;
  var imgTwin = exportPhotoTwin ? await loadImage(exportPhotoTwin) : null;
  
  // ===== 英文部分 =====
  // 主标题
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Venue/会议地点", bold: true, size: 28 })],
  }));
  
  // 会议介绍
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: meetingName + "   will be held in " + hotel.city + ", China during " + meetingDate + ". For further information of the hotel, please find below.", size: 21 })],
  }));
  
  // 三个空行
  children.push(new docx.Paragraph({ children: [] }));
  children.push(new docx.Paragraph({ children: [] }));
  children.push(new docx.Paragraph({ children: [] }));
  
  // Ⅰ. Information
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅰ. Information：", bold: true })],
  }));
  
  // 酒店名称 + Hotel Website
  children.push(new docx.Paragraph({ 
    children: [
      new docx.TextRun({ text: hotel.name, size: 21 }),
      new docx.TextRun({ text: " \nHotel Website：click", size: 21 })
    ],
  }));
  
  // 电话
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Tel：+86-" + (hotel.phone || ""), size: 21 })],
  }));
  
  // 地址
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Address: " + (hotel.address || "") })],
  }));
  
  // 大床房图片
  if (imgQueen) {
    children.push(new docx.Paragraph({ 
      children: [new docx.ImageRun({ data: imgQueen, transformation: { width: 350, height: 263 } })],
    }));
  } else {
    children.push(new docx.Paragraph({ 
      children: [new docx.TextRun({ text: "（大床房照片待补充）", italics: true, color: "888888" })],
    }));
  }
  
  // 双床房图片
  if (imgTwin) {
    children.push(new docx.Paragraph({ 
      children: [new docx.ImageRun({ data: imgTwin, transformation: { width: 350, height: 263 } })],
    }));
  } else {
    children.push(new docx.Paragraph({ 
      children: [new docx.TextRun({ text: "（双床房照片待补充）", italics: true, color: "888888" })],
    }));
  }
  
  // 大床房价格
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: ">> Standard single room: RMB " + priceQueen + "/ night (about USD " + (priceQueen/7.1).toFixed(1) + "/ night). (One bed, Internet and one breakfast included)" })],
  }));
  
  // 双床房价格
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: ">> Standard double room: RMB " + priceTwin + "/ night (about USD " + (priceTwin/7.1).toFixed(1) + "/ night). (Two beds, Internet and two breakfast included)" })],
  }));
  
  // 空行
  children.push(new docx.Paragraph({ children: [] }));
  
  // Ⅱ. Room Booking
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅱ. Room Booking：", bold: true, size: 24 })],
  }));
  
  // 预订说明
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "You can make a reservation by calling the " + contactPhone + " before " + deadline + ", please tell that you are a guest of \" " + meetingName + " \", and then can enjoy the agreed price." })],
  }));
  
  // 空行
  children.push(new docx.Paragraph({ children: [] }));
  
  // Ⅲ. Direction
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅲ. Direction：", bold: true, size: 24 })],
  }));
  
  // 交通枢纽
  if (hotel.transport) {
    for (var i = 0; i < hotel.transport.length; i++) {
      var t = hotel.transport[i];
      children.push(new docx.Paragraph({ 
        children: [
          new docx.TextRun({ text: "* "}),
          new docx.TextRun({ text: t.name, bold: true }),
          new docx.TextRun({ text: " : " + t.distance + " ; " + t.drive })
        ],
      }));
    }
  }
  
  // 空行
  children.push(new docx.Paragraph({ children: [] }));
  
  // Ⅳ. Tips
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅳ. Tips：", bold: true, size: 24 })],
  }));
  
  // Tips内容
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "For non-Chinese Attendees, \"Bring me to the hotel\" card is available. You can show it to the taxi drivers and they will take you to the hotel." })],
  }));
  
  // 中文提示
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "(可将修改后的方框截图，作为图片上传官网，方便参会者下载)", size: 20 })],
  }));
  
  // 空行
  children.push(new docx.Paragraph({ children: [] }));
  
  // ===== 中文部分 =====
  // 会议介绍
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: meetingName + "  将于" + meetingDate + "在" + hotel.name + "举行。具体酒店信息和预定方式如下： ", size: 21 })],
  }));
  
  // 空行
  children.push(new docx.Paragraph({ children: [] }));
  
  // Ⅰ. 酒店信息
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅰ. 酒店信息：", bold: true })],
  }));
  
  // 酒店名称 + 酒店官网
  children.push(new docx.Paragraph({ 
    children: [
      new docx.TextRun({ text: hotel.name, bold: true, size: 21 }),
      new docx.TextRun({ text: "\n酒店官网：查看", size: 21 })
    ],
  }));
  
  // 酒店电话
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "酒店电话：+86-" + (hotel.phone || ""), size: 21 })],
  }));
  
  // 酒店地址
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "酒店地址：" + (hotel.address || ""), size: 21 })],
  }));
  
  // 空行
  children.push(new docx.Paragraph({ children: [] }));
  
  // 大床房图片
  if (imgQueen) {
    children.push(new docx.Paragraph({ 
      children: [new docx.ImageRun({ data: imgQueen, transformation: { width: 350, height: 263 } })],
    }));
  } else {
    children.push(new docx.Paragraph({ 
      children: [new docx.TextRun({ text: "（大床房照片待补充）", italics: true, color: "888888" })],
    }));
  }
  
  // 双床房图片
  if (imgTwin) {
    children.push(new docx.Paragraph({ 
      children: [new docx.ImageRun({ data: imgTwin, transformation: { width: 350, height: 263 } })],
    }));
  } else {
    children.push(new docx.Paragraph({ 
      children: [new docx.TextRun({ text: "（双床房照片待补充）", italics: true, color: "888888" })],
    }));
  }
  
  // 大床房价格
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: ">> 高级大床房：" + priceQueen + "元  含1张床/无线网络/ 1份早餐" })],
  }));
  
  // 双床房价格
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: ">> 高级双床房：" + priceTwin + "元  含2张床/无线网络/ 2份早餐" })],
  }));
  
  // 空行
  children.push(new docx.Paragraph({ children: [] }));
  
  // Ⅱ. 房间预定方式
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅱ. 房间预定方式：", bold: true, size: 24 })],
  }));
  
  // 预订说明1
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "1. 可编辑短信“ " + meetingName + "  +姓名+入住日期+退房日期+房型+入住人数”，发送至" + contactName + " " + contactPhone + " 。" })],
  }));
  
  // 预订说明2
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "2. 请勿重复预定。请尽快在" + deadline + "前完成预定（逾期无法保证房间安排，需视酒店房态而定），如有变动或取消预定需提前一周告知酒店经理。酒店费用将由酒店直接收取并开具发票。" })],
  }));
  
  // 空行
  children.push(new docx.Paragraph({ children: [] }));
  
  // Ⅲ. 交通指南
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅲ. 交通指南：", bold: true, size: 24 })],
  }));
  
  // 交通枢纽
  if (hotel.transport) {
    for (var j = 0; j < hotel.transport.length; j++) {
      var t2 = hotel.transport[j];
      children.push(new docx.Paragraph({ 
        children: [new docx.TextRun({ text: "*" + t2.name + ": " + t2.distance + " ; " + t2.drive })],
      }));
    }
  }
  
  var doc = new docx.Document({ 
    sections: [{ 
      properties: {
        page: {
          margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 }
        }
      },
      children: children 
    }] 
  });
  
  docx.Packer.toBlob(doc).then(function(blob) {
    saveAs(blob, hotel.name + "-酒店推荐.docx");
    document.getElementById("export-modal").classList.remove("show");
    alert("文档已生成！");
  });
});
</script>
</body>
</html>
