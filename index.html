<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>综合查询系统</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
body { background: #0B1120; color: #F1F5F9; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; }
.app { max-width: 480px; margin: 0 auto; }
.tab-bar { display: flex; background: #131B2E; border-radius: 12px; padding: 4px; margin-bottom: 24px; }
.tab-item { flex: 1; text-align: center; padding: 12px; cursor: pointer; border-radius: 8px; color: #94A3B8; }
.tab-item.active { background: #D4A853; color: #0B1120; font-weight: bold; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.form-card { background: #131B2E; padding: 24px; border-radius: 16px; margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; color: #94A3B8; font-size: 14px; }
input { width: 100%; height: 48px; background: #1A2440; border: 1px solid #334155; border-radius: 8px; padding: 0 12px; color: #F1F5F9; box-sizing: border-box; margin-bottom: 16px; }
button { width: 100%; height: 48px; background: #D4A853; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #0B1120; }
.hotel-card { background: #131B2E; border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
.hotel-header { padding: 20px; }
.hotel-name { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
.hotel-address { color: #94A3B8; font-size: 14px; }
.hotel-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
.photo-item { position: relative; aspect-ratio: 4/3; background: #1A2440; }
.photo-item img { width: 100%; height: 100%; object-fit: cover; }
.photo-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px; background: rgba(0,0,0,.7); font-size: 12px; }
.section-title { padding: 16px 20px 8px; font-weight: 600; }
.transport-list { padding: 0 20px 16px; }
.transport-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1E293B; }
.export-btn { background: linear-gradient(135deg, #D4A853, #B8923E); color: #0B1120; font-weight: bold; margin-bottom: 12px; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
.modal-overlay.show { display: flex; }
.modal-content { background: #131B2E; border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; padding: 24px; }
.suggest-dropdown { position: absolute; background: #1A2440; border-radius: 8px; margin-top: 4px; max-height: 280px; overflow-y: auto; z-index: 50; display: none; }
.suggest-dropdown.show { display: block; }
.suggest-item { padding: 12px 16px; cursor: pointer; }
.suggest-item:hover { background: rgba(212,168,83,.1); }
</style>
</head>
<body>
<div class="app">
  <div class="tab-bar">
    <div class="tab-item active" data-tab="seat-tab">座位查询</div>
    <div class="tab-item" data-tab="hotel-tab">酒店查询</div>
  </div>

  <div class="tab-pane active" id="seat-tab">
    <div class="form-card">
      <label>参会人姓名</label>
      <input type="text" id="name-input" placeholder="请输入您的姓名">
      <button id="search-btn">查 询 座 位</button>
    </div>
  </div>

  <div class="tab-pane" id="hotel-tab">
    <div class="form-card">
      <label>酒店名称</label>
      <div style="position:relative">
        <input type="text" id="hotel-input" placeholder="支持名称/区域/城市搜索">
        <div class="suggest-dropdown" id="hotel-suggest"></div>
      </div>
      <button id="hotel-search-btn">查 询 酒 店</button>
    </div>
    <div id="hotel-detail"></div>
    <button class="export-btn" id="export-btn" style="display:none">导出酒店推荐Word文档</button>
  </div>
</div>

<div class="modal-overlay" id="export-modal">
  <div class="modal-content">
    <h3 style="margin-top:0">导出酒店推荐文档</h3>
    <label>会议名称</label>
    <input type="text" id="doc-meeting-name" placeholder="例如：ICEPG 2024">
    <label>会议时间</label>
    <input type="text" id="doc-meeting-date" placeholder="例如：2024年9月27-29日">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label>大床房价格</label>
        <input type="number" id="doc-price-queen" placeholder="550">
      </div>
      <div>
        <label>双床房价格</label>
        <input type="number" id="doc-price-twin" placeholder="550">
      </div>
    </div>
    <label>预订联系人</label>
    <input type="text" id="doc-contact-name" placeholder="张经理">
    <label>预订电话</label>
    <input type="tel" id="doc-contact-phone" placeholder="13700000000">
    <label>预订截止日期</label>
    <input type="text" id="doc-deadline" placeholder="9月23日前">
    <div style="display:flex;gap:12px;margin-top:16px">
      <button id="export-cancel" style="background:#1A2440;color:#94A3B8">取消</button>
      <button id="export-confirm">生成文档</button>
    </div>
  </div>
</div>

<script src="seats.js"></script>
<script src="hotels.js"></script>
<script>
var currentHotel = null;

// Tab 切换
var tabs = document.querySelectorAll(".tab-item");
for (var i = 0; i < tabs.length; i++) {
  tabs[i].addEventListener("click", function() {
    var target = this.getAttribute("data-tab");
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].classList.remove("active");
    }
    this.classList.add("active");
    var panes = document.querySelectorAll(".tab-pane");
    for (var k = 0; k < panes.length; k++) {
      panes[k].classList.remove("active");
    }
    document.getElementById(target).classList.add("active");
  });
}

// 酒店查询
document.getElementById("hotel-search-btn").addEventListener("click", function() {
  var keyword = document.getElementById("hotel-input").value.trim();
  if (!keyword) return;
  searchHotelAndShow(keyword);
});

document.getElementById("hotel-input").addEventListener("input", function() {
  updateSuggest(this.value);
});

function searchHotelAndShow(keyword) {
  var q = keyword.toLowerCase();
  var found = null;
  if (typeof HOTEL_DATA !== "undefined") {
    for (var i = 0; i < HOTEL_DATA.length; i++) {
      if (HOTEL_DATA[i].name.toLowerCase().indexOf(q) !== -1) {
        found = HOTEL_DATA[i];
        break;
      }
    }
  }
  if (found) {
    currentHotel = found;
    showHotelDetail(found);
    document.getElementById("export-btn").style.display = "block";
  } else {
    alert("未找到酒店: " + keyword);
  }
}

function showHotelDetail(hotel) {
  var html = '<div class="hotel-card">';
  html += '<div class="hotel-header">';
  html += '<div class="hotel-name">' + hotel.name + '</div>';
  html += '<div class="hotel-address">' + (hotel.address || "") + '</div>';
  html += '</div>';
  html += '<div class="hotel-photos">';
  if (hotel.photoQueen) {
    html += '<div class="photo-item"><img src="' + hotel.photoQueen + '"><div class="photo-label">大床房</div></div>';
  }
  if (hotel.photoTwin) {
    html += '<div class="photo-item"><img src="' + hotel.photoTwin + '"><div class="photo-label">双床房</div></div>';
  }
  html += '</div>';
  if (hotel.transport && hotel.transport.length > 0) {
    html += '<div class="section-title">周边交通枢纽</div><div class="transport-list">';
    for (var i = 0; i < hotel.transport.length; i++) {
      var t = hotel.transport[i];
      html += '<div class="transport-item"><span>' + t.name + '</span><span>' + t.distance + '</span></div>';
    }
    html += '</div>';
  }
  html += '</div>';
  document.getElementById("hotel-detail").innerHTML = html;
}

function updateSuggest(keyword) {
  var dropdown = document.getElementById("hotel-suggest");
  var q = keyword.trim().toLowerCase();
  if (!q || typeof HOTEL_DATA === "undefined") {
    dropdown.classList.remove("show");
    return;
  }
  var matches = [];
  for (var i = 0; i < HOTEL_DATA.length; i++) {
    if (HOTEL_DATA[i].name.toLowerCase().indexOf(q) !== -1) {
      matches.push(HOTEL_DATA[i]);
      if (matches.length >= 8) break;
    }
  }
  if (matches.length === 0) {
    dropdown.classList.remove("show");
    return;
  }
  var html = "";
  for (var j = 0; j < matches.length; j++) {
    var h = matches[j];
    html += '<div class="suggest-item" data-name="' + h.name + '">' + h.name + '</div>';
  }
  dropdown.innerHTML = html;
  dropdown.classList.add("show");
  var items = dropdown.querySelectorAll(".suggest-item");
  for (var k = 0; k < items.length; k++) {
    items[k].addEventListener("click", function() {
      document.getElementById("hotel-input").value = this.getAttribute("data-name");
      dropdown.classList.remove("show");
      searchHotelAndShow(this.getAttribute("data-name"));
    });
  }
}

// 导出功能
document.getElementById("export-btn").addEventListener("click", function() {
  document.getElementById("export-modal").classList.add("show");
});

document.getElementById("export-cancel").addEventListener("click", function() {
  document.getElementById("export-modal").classList.remove("show");
});

document.getElementById("export-confirm").addEventListener("click", function() {
  if (!currentHotel) {
    alert("请先查询酒店");
    return;
  }
  if (typeof docx === "undefined") {
    alert("Word库未加载");
    return;
  }
  
  // 获取用户输入
  var meetingName = document.getElementById("doc-meeting-name").value.trim() || "ICEPG 2024";
  var meetingDate = document.getElementById("doc-meeting-date").value.trim() || "2024年9月27-29日";
  var priceQueen = document.getElementById("doc-price-queen").value.trim() || "550";
  var priceTwin = document.getElementById("doc-price-twin").value.trim() || "550";
  var contactName = document.getElementById("doc-contact-name").value.trim() || "张经理";
  var contactPhone = document.getElementById("doc-contact-phone").value.trim() || "13700000000";
  var deadline = document.getElementById("doc-deadline").value.trim() || "9月23日前";
  
  var hotel = currentHotel;
  var children = [];
  
  // ===== 英文部分 =====
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Venue/会议地点", bold: true, size: 28 })],
    spacing: { after: 200 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: meetingName + " will be held in " + hotel.city + ", China during " + meetingDate + ". For further information of the hotel, please find below.", size: 22 })],
    spacing: { after: 400 }
  }));
  
  // Ⅰ. Information
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅰ. Information：", bold: true, size: 24 })],
    spacing: { before: 200, after: 200 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: hotel.name, size: 22 })],
    spacing: { after: 100 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Tel：" + (hotel.phone || ""), size: 22 })],
    spacing: { after: 100 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Address: " + (hotel.address || ""), size: 22 })],
    spacing: { after: 200 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: ">> Standard single room: RMB " + priceQueen + "/ night (about USD " + Math.round(priceQueen/7.1) + "/ night). (One bed, Internet and one breakfast included)", size: 22 })],
    spacing: { after: 100 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: ">> Standard double room: RMB " + priceTwin + "/ night (about USD " + Math.round(priceTwin/7.1) + "/ night). (Two beds, Internet and two breakfast included)", size: 22 })],
    spacing: { after: 400 }
  }));
  
  // Ⅱ. Room Booking
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅱ. Room Booking：", bold: true, size: 24 })],
    spacing: { before: 200, after: 200 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "You can make a reservation by calling " + contactPhone + " before " + deadline + ", please tell that you are a guest of \"" + meetingName + "\", and then can enjoy the agreed price.", size: 22 })],
    spacing: { after: 400 }
  }));
  
  // Ⅲ. Direction
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅲ. Direction：", bold: true, size: 24 })],
    spacing: { before: 200, after: 200 }
  }));
  
  if (hotel.transport) {
    for (var i = 0; i < hotel.transport.length; i++) {
      var t = hotel.transport[i];
      children.push(new docx.Paragraph({ 
        children: [new docx.TextRun({ text: "* " + t.name + " : " + t.distance + " ; " + t.drive, size: 22 })],
        spacing: { after: 100 }
      }));
    }
  }
  
  children.push(new docx.Paragraph({ spacing: { after: 400 } }));
  
  // Ⅳ. Tips
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅳ. Tips：", bold: true, size: 24 })],
    spacing: { before: 200, after: 200 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "For non-Chinese Attendees, \"Bring me to the hotel\" card is available. You can show it to the taxi drivers and they will take you to the hotel.", size: 22 })],
    spacing: { after: 600 }
  }));
  
  // 分隔线
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "————————————————————————————", size: 22, color: "999999" })],
    spacing: { after: 400 }
  }));
  
  // ===== 中文部分 =====
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: meetingName + " 将于" + meetingDate + "在" + hotel.name + "举行。具体酒店信息和预定方式如下：", size: 22 })],
    spacing: { after: 400 }
  }));
  
  // Ⅰ. 酒店信息
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅰ. 酒店信息：", bold: true, size: 24 })],
    spacing: { before: 200, after: 200 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: hotel.name, size: 22 })],
    spacing: { after: 100 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "酒店电话：" + (hotel.phone || ""), size: 22 })],
    spacing: { after: 100 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "酒店地址：" + (hotel.address || ""), size: 22 })],
    spacing: { after: 200 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: ">> 高级大床房：" + priceQueen + "元  含1张床/无线网络/ 1份早餐", size: 22 })],
    spacing: { after: 100 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: ">> 高级双床房：" + priceTwin + "元  含2张床/无线网络/ 2份早餐", size: 22 })],
    spacing: { after: 400 }
  }));
  
  // Ⅱ. 房间预定方式
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅱ. 房间预定方式：", bold: true, size: 24 })],
    spacing: { before: 200, after: 200 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "1. 可编辑短信\"" + meetingName + " +姓名+入住日期+退房日期+房型+入住人数\"，发送至" + contactName + " " + contactPhone + "。", size: 22 })],
    spacing: { after: 100 }
  }));
  
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "2. 请勿重复预定。请尽快在" + deadline + "前完成预定（逾期无法保证房间安排，需视酒店房态而定），如有变动或取消预定需提前一周告知酒店经理。酒店费用将由酒店直接收取并开具发票。", size: 22 })],
    spacing: { after: 400 }
  }));
  
  // Ⅲ. 交通指南
  children.push(new docx.Paragraph({ 
    children: [new docx.TextRun({ text: "Ⅲ. 交通指南：", bold: true, size: 24 })],
    spacing: { before: 200, after: 200 }
  }));
  
  if (hotel.transport) {
    for (var j = 0; j < hotel.transport.length; j++) {
      var t2 = hotel.transport[j];
      children.push(new docx.Paragraph({ 
        children: [new docx.TextRun({ text: "*" + t2.name + ": " + t2.distance + " ; " + t2.drive, size: 22 })],
        spacing: { after: 100 }
      }));
    }
  }
  
  var doc = new docx.Document({ 
    sections: [{ 
      properties: {
        page: {
          margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 }
        }
      },
      children: children 
    }] 
  });
  
  docx.Packer.toBlob(doc).then(function(blob) {
    saveAs(blob, hotel.name + "-酒店推荐.docx");
    document.getElementById("export-modal").classList.remove("show");
    alert("文档已生成！");
  });
});
</script>
</body>
</html>
