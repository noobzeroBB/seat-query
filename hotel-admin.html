<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店管理后台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0B1120; color: #F1F5F9; font-family: -apple-system, "Microsoft YaHei", sans-serif; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
.header { background: #131B2E; border: 1px solid rgba(212,168,83,0.2); padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 24px; color: #D4A853; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
.btn-primary { background: #D4A853; color: #0B1120; }
.btn-secondary { background: #1A2440; color: #94A3B8; border: 1px solid #334155; }
.btn-danger { background: #EF4444; color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: #131B2E; border: 1px solid rgba(212,168,83,0.2); padding: 20px; border-radius: 12px; text-align: center; }
.stat-number { font-size: 32px; font-weight: bold; color: #D4A853; }
.stat-label { color: #94A3B8; margin-top: 8px; font-size: 13px; }
.hotel-list { background: #131B2E; border: 1px solid rgba(212,168,83,0.2); border-radius: 12px; overflow: hidden; }
.hotel-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #1E293B; }
.hotel-item:hover { background: rgba(212,168,83,0.05); }
.hotel-info { flex: 1; }
.hotel-name { font-weight: bold; font-size: 16px; color: #F1F5F9; }
.hotel-meta { color: #94A3B8; font-size: 13px; margin-top: 4px; }
.hotel-actions { display: flex; gap: 8px; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.show { display: flex; }
.modal { background: #131B2E; border-radius: 16px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 24px; border: 1px solid rgba(212,168,83,0.2); }
.modal h2 { margin-bottom: 20px; color: #D4A853; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; color: #94A3B8; font-size: 14px; }
.form-group input { width: 100%; padding: 10px 12px; background: #1A2440; border: 1px solid #334155; border-radius: 8px; font-size: 14px; color: #F1F5F9; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.transport-row { display: grid; grid-template-columns: 1fr 1fr 1fr 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
.remove-btn { width: 30px; height: 30px; background: #EF4444; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
.empty { text-align: center; padding: 40px; color: #64748B; }
.export-area { background: #1A2440; padding: 16px; border-radius: 8px; margin-top: 16px; }
.export-area textarea { width: 100%; height: 200px; font-family: monospace; font-size: 12px; background: #0B1120; color: #34D399; border: 1px solid #334155; border-radius: 6px; padding: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏨 酒店管理后台</h1>
    <div style="display:flex;gap:12px">
      <button class="btn btn-secondary" onclick="exportData()">导出数据</button>
      <button class="btn btn-primary" onclick="openModal()">+ 添加酒店</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-number" id="total-hotels">0</div>
      <div class="stat-label">总酒店数</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="total-cities">0</div>
      <div class="stat-label">覆盖城市</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="total-transport">0</div>
      <div class="stat-label">交通枢纽记录</div>
    </div>
  </div>

  <div class="hotel-list" id="hotel-list">
    <div class="empty">加载中...</div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2 id="modal-title">添加酒店</h2>
    <input type="hidden" id="edit-index" value="-1">
    
    <div class="form-group">
      <label>酒店名称 *</label>
      <input type="text" id="hotel-name" placeholder="例如：广州保利洲际酒店">
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>城市</label>
        <input type="text" id="hotel-city" placeholder="例如：广州">
      </div>
      <div class="form-group">
        <label>区域</label>
        <input type="text" id="hotel-district" placeholder="例如：天河">
      </div>
    </div>
    
    <div class="form-group">
      <label>酒店地址</label>
      <input type="text" id="hotel-address" placeholder="例如：天河区花城广场">
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>酒店电话</label>
        <input type="text" id="hotel-phone" placeholder="例如：020-12345678">
      </div>
      <div class="form-group">
        <label>星级</label>
        <input type="text" id="hotel-star" placeholder="例如：五星">
      </div>
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>大床房照片URL</label>
        <input type="text" id="hotel-photo-queen" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>双床房照片URL</label>
        <input type="text" id="hotel-photo-twin" placeholder="https://...">
      </div>
    </div>
    
    <div class="form-group">
      <label>交通枢纽（名称 | 距离 | 车程）</label>
      <div id="transport-list"></div>
      <button class="btn btn-secondary btn-sm" onclick="addTransportRow()" style="margin-top:8px">+ 添加交通枢纽</button>
    </div>
    
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveHotel()">保存</button>
    </div>
  </div>
</div>

<!-- 导出弹窗 -->
<div class="modal-overlay" id="export-modal">
  <div class="modal">
    <h2>导出 hotels.js</h2>
    <p style="color:#94A3B8;margin-bottom:16px">复制下面的代码，替换项目里的 hotels.js 文件即可：</p>
    <div class="export-area">
      <textarea id="export-code" readonly></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeExportModal()">关闭</button>
      <button class="btn btn-primary" onclick="copyExport()">复制代码</button>
    </div>
  </div>
</div>

<script src="hotels.js"></script>
<script>
var hotels = [];

// 初始化
function init() {
  if (typeof HOTEL_DATA !== "undefined") {
    hotels = JSON.parse(JSON.stringify(HOTEL_DATA));
  }
  renderList();
  updateStats();
}

// 渲染列表
function renderList() {
  var listEl = document.getElementById("hotel-list");
  if (hotels.length === 0) {
    listEl.innerHTML = '<div class="empty">暂无酒店数据，点击"添加酒店"开始录入</div>';
    return;
  }
  
  var html = "";
  for (var i = 0; i < hotels.length; i++) {
    var h = hotels[i];
    html += '<div class="hotel-item">';
    html += '<div class="hotel-info">';
    html += '<div class="hotel-name">' + h.name + '</div>';
    html += '<div class="hotel-meta">' + (h.city || '') + ' · ' + (h.district || '') + ' · ' + (h.star || '') + '</div>';
    html += '</div>';
    html += '<div class="hotel-actions">';
    html += '<button class="btn btn-secondary btn-sm" onclick="editHotel(' + i + ')">编辑</button>';
    html += '<button class="btn btn-danger btn-sm" onclick="deleteHotel(' + i + ')">删除</button>';
    html += '</div>';
    html += '</div>';
  }
  listEl.innerHTML = html;
}

// 更新统计
function updateStats() {
  document.getElementById("total-hotels").textContent = hotels.length;
  
  var cities = {};
  var transportCount = 0;
  for (var i = 0; i < hotels.length; i++) {
    if (hotels[i].city) cities[hotels[i].city] = true;
    if (hotels[i].transport) transportCount += hotels[i].transport.length;
  }
  
  document.getElementById("total-cities").textContent = Object.keys(cities).length;
  document.getElementById("total-transport").textContent = transportCount;
}

// 打开编辑弹窗
function openModal(index) {
  document.getElementById("edit-modal").classList.add("show");
  document.getElementById("transport-list").innerHTML = "";
  
  if (index >= 0) {
    document.getElementById("modal-title").textContent = "编辑酒店";
    document.getElementById("edit-index").value = index;
    var h = hotels[index];
    document.getElementById("hotel-name").value = h.name || "";
    document.getElementById("hotel-city").value = h.city || "";
    document.getElementById("hotel-district").value = h.district || "";
    document.getElementById("hotel-address").value = h.address || "";
    document.getElementById("hotel-phone").value = h.phone || "";
    document.getElementById("hotel-star").value = h.star || "";
    document.getElementById("hotel-photo-queen").value = h.photoQueen || "";
    document.getElementById("hotel-photo-twin").value = h.photoTwin || "";
    
    if (h.transport) {
      for (var i = 0; i < h.transport.length; i++) {
        addTransportRow(h.transport[i].name, h.transport[i].distance, h.transport[i].drive);
      }
    }
  } else {
    document.getElementById("modal-title").textContent = "添加酒店";
    document.getElementById("edit-index").value = "-1";
    document.getElementById("hotel-name").value = "";
    document.getElementById("hotel-city").value = "";
    document.getElementById("hotel-district").value = "";
    document.getElementById("hotel-address").value = "";
    document.getElementById("hotel-phone").value = "";
    document.getElementById("hotel-star").value = "";
    document.getElementById("hotel-photo-queen").value = "";
    document.getElementById("hotel-photo-twin").value = "";
    addTransportRow();
  }
}

function closeModal() {
  document.getElementById("edit-modal").classList.remove("show");
}

// 添加交通枢纽行
function addTransportRow(name, distance, drive) {
  var list = document.getElementById("transport-list");
  var row = document.createElement("div");
  row.className = "transport-row";
  row.innerHTML = 
    '<input type="text" class="t-name" placeholder="名称" value="' + (name || '') + '">' +
    '<input type="text" class="t-distance" placeholder="距离" value="' + (distance || '') + '">' +
    '<input type="text" class="t-drive" placeholder="车程" value="' + (drive || '') + '">' +
    '<button class="remove-btn" onclick="this.parentElement.remove()">×</button>';
  list.appendChild(row);
}

// 保存酒店
function saveHotel() {
  var name = document.getElementById("hotel-name").value.trim();
  if (!name) {
    alert("请输入酒店名称");
    return;
  }
  
  var index = parseInt(document.getElementById("edit-index").value);
  
  var hotel = {
    name: name,
    city: document.getElementById("hotel-city").value.trim(),
    district: document.getElementById("hotel-district").value.trim(),
    address: document.getElementById("hotel-address").value.trim(),
    phone: document.getElementById("hotel-phone").value.trim(),
    star: document.getElementById("hotel-star").value.trim(),
    photoQueen: document.getElementById("hotel-photo-queen").value.trim(),
    photoTwin: document.getElementById("hotel-photo-twin").value.trim(),
    transport: []
  };
  
  var rows = document.querySelectorAll(".transport-row");
  for (var i = 0; i < rows.length; i++) {
    var tName = rows[i].querySelector(".t-name").value.trim();
    var tDistance = rows[i].querySelector(".t-distance").value.trim();
    var tDrive = rows[i].querySelector(".t-drive").value.trim();
    if (tName) {
      hotel.transport.push({ name: tName, distance: tDistance, drive: tDrive });
    }
  }
  
  if (index >= 0) {
    hotels[index] = hotel;
  } else {
    hotels.push(hotel);
  }
  
  closeModal();
  renderList();
  updateStats();
}

function editHotel(index) {
  openModal(index);
}

function deleteHotel(index) {
  if (confirm("确定要删除 " + hotels[index].name + " 吗？")) {
    hotels.splice(index, 1);
    renderList();
    updateStats();
  }
}

function exportData() {
  var code = "var HOTEL_DATA = " + JSON.stringify(hotels, null, 2) + ";";
  document.getElementById("export-code").value = code;
  document.getElementById("export-modal").classList.add("show");
}

function closeExportModal() {
  document.getElementById("export-modal").classList.remove("show");
}

function copyExport() {
  var codeEl = document.getElementById("export-code");
  codeEl.select();
  document.execCommand("copy");
  alert("代码已复制！替换 hotels.js 文件即可");
}

init();
</script>
</body>
</html>
